<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="30-Day Flame"><title>30-Day Flame</title><style>.core{transform-origin:60px 60px;animation:lift 4.8s ease-in-out infinite}.signal{stroke-dasharray:120;animation:voice 4.8s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 4.8s ease-in-out infinite}.shine{animation:sweep 4.8s ease-in-out infinite}.orbit{transform-origin:60px 60px;animation:orbit 4.8s ease-in-out infinite}@keyframes lift{0%,65%,100%{transform:translateY(0)}20%{transform:translateY(-4px)}40%{transform:translateY(1px)}}@keyframes voice{0%,100%{stroke-dashoffset:120;opacity:.3}22%,72%{stroke-dashoffset:0;opacity:1}}@keyframes spark{0%,70%,100%{transform:scale(.55);opacity:.25}28%,45%{transform:scale(1.25);opacity:1}}@keyframes sweep{0%,5%{transform:translateX(-130px);opacity:0}15%{opacity:.32}45%{transform:translateX(130px);opacity:0}100%{transform:translateX(130px);opacity:0}}@keyframes orbit{0%{transform:rotate(-22deg);opacity:.3}35%{transform:rotate(42deg);opacity:.8}75%,100%{transform:rotate(70deg);opacity:.2}}@media(prefers-reduced-motion:reduce){.core,.signal,.spark,.shine,.orbit{animation:none}.signal{stroke-dashoffset:0}.shine{display:none}}</style><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#ffe6b4"/><stop offset=".45" stop-color="#f38934"/><stop offset="1" stop-color="#ad4821"/></linearGradient><linearGradient id="face" x2=".7" y2="1"><stop stop-color="#20556c"/><stop offset="1" stop-color="#052333"/></linearGradient><clipPath id="cut"><path d="M60 6Q63 6 66 8L96 23Q99 25 100 29L111 57Q112 60 110 64L99 93Q98 97 94 99L64 113Q60 115 56 113L26 99Q22 97 21 93L10 64Q8 60 9 57L20 29Q21 25 24 23L54 8Q57 6 60 6Z"/></clipPath></defs><path d="M60 6Q63 6 66 8L96 23Q99 25 100 29L111 57Q112 60 110 64L99 93Q98 97 94 99L64 113Q60 115 56 113L26 99Q22 97 21 93L10 64Q8 60 9 57L20 29Q21 25 24 23L54 8Q57 6 60 6Z" transform="translate(0 2)" fill="#021723"/><path d="M60 